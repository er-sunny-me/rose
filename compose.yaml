services:
  rose:
    build: .
    ports:
      - "127.0.0.1:3000:3000"   # localhost-only by default (§121)
    environment:
      - NODE_ENV=production
      # Auth token: REQUIRED when exposing beyond localhost.
      # Generate once: node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
      #- ROSE_API_TOKEN=change-me
      # Providers — pass via environment/secrets, never bake into the image (§115)
      #- GEMINI_API_KEY=
      #- GITHUB_TOKEN=
      # Optional local-model endpoint OUTSIDE the container (§125)
      #- OLLAMA_HOST=http://host.docker.internal:11434
      # Vector backend: sqlite recommended inside the container
      - ROSE_VECTOR_BACKEND=sqlite
    volumes:
      - rose-config:/data/.rose
      - rose-memory:/app/memory
      - rose-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  rose-config:
  rose-memory:
  rose-data:
